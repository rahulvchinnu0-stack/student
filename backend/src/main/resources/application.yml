server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: student-attendance-management-system
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://db.your-project.supabase.co:5432/postgres?sslmode=require}
    username: ${SUPABASE_DB_USERNAME:postgres}
    password: ${SUPABASE_DB_PASSWORD:your-password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      # Do not use Hibernate to automatically create production schema (Section 1)
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

# Supabase Auth JWT Config
supabase:
  url: ${SUPABASE_URL:https://your-project.supabase.co}
  jwt:
    secret: ${SUPABASE_JWT_SECRET:your-supabase-jwt-secret}
    issuer: ${SUPABASE_JWT_ISSUER:https://your-project.supabase.co/auth/v1}

# Application Security & CORS
app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000}
  settings:
    default-attendance-threshold: 75.00
    default-qr-expiry-seconds: 120

# Actuator Health Config (Section 56: do not expose env or secrets)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
